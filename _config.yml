# Site
title: "AI tech notes"
description: "AI 기술과 개발 — 트렌드부터 꼭 알아야 할 기초·심화까지"
author: haangman
lang: ko-KR
timezone: Asia/Seoul

# URL
url: "https://haangman.github.io"
baseurl: "/J-Blog-AI"

# Google Search Console verification — GSC 등록 후 사용자가 토큰 채움.
# <meta name="google-site-verification" content="여기값"> 의 content 값만.
# jekyll-seo-tag 가 이 필드를 자동으로 meta 태그로 출력.
#<meta name="google-site-verification" content="z9a9RSK9CLJnq-mDNm8beC5UemOO2czYXSdvQpHql4U" />
google_site_verification: "z9a9RSK9CLJnq-mDNm8beC5UemOO2czYXSdvQpHql4U"

# Giscus 댓글 — https://giscus.app 에서 설정 후 repo_id / category_id 채움.
# 사전 작업: 리포 Settings → Features → Discussions 활성 + giscus app 설치.
giscus:
  enabled: false                   # 토큰 채운 후 true 로 바꿈
  repo: "haangman/J-Blog-AI"
  repo_id: "R_kgDOSf7Kvw"                      # giscus.app 의 data-repo-id
  category: "Announcements"
  category_id: "DIC_kwDOSf7Kv84C9T1Y"                  # giscus.app 의 data-category-id
  mapping: "pathname"
  strict: "0"
  reactions_enabled: "1"
  emit_metadata: "0"
  input_position: "bottom"
  theme: "preferred_color_scheme"
  lang: "ko"

# Build
theme: minima
markdown: kramdown
permalink: /:year/:month/:day/:slug/

# Pagination
paginate: 10
paginate_path: "/page:num/"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

# Exclude from build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - .gitignore
  - vendor/
