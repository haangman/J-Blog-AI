# Site
title: "AI tech notes"
description: "AI 기술과 개발 — 트렌드부터 꼭 알아야 할 기초·심화까지"
author: haangman
lang: ko-KR
timezone: Asia/Seoul

# URL
url: "https://haangman.github.io"
baseurl: "/J-Blog-AI"

# Google Search Console verification — GSC 등록 후 사용자가 토큰 채움.
# <meta name="google-site-verification" content="여기값"> 의 content 값만.
# jekyll-seo-tag 가 이 필드를 자동으로 meta 태그로 출력.
google_site_verification: ""

# Build
theme: minima
markdown: kramdown
permalink: /:year/:month/:day/:slug/

# Pagination
paginate: 10
paginate_path: "/page:num/"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

# Exclude from build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - .gitignore
  - vendor/
