<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}

  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}

  <!-- Mermaid: 본문 안 ```mermaid``` 코드블록을 자동 렌더링 -->
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: false, theme: 'default' });

    document.addEventListener('DOMContentLoaded', () => {
      // Jekyll/kramdown 은 ```mermaid``` 를 <pre><code class="language-mermaid"> 로 변환.
      // mermaid.run 이 인식하도록 div.mermaid 로 치환.
      const blocks = document.querySelectorAll('pre > code.language-mermaid, pre > code[class*="language-mermaid"]');
      blocks.forEach((codeEl, idx) => {
        const pre = codeEl.parentElement;
        const div = document.createElement('div');
        div.className = 'mermaid';
        div.id = `mermaid-${idx}`;
        div.textContent = codeEl.textContent;
        pre.replaceWith(div);
      });
      mermaid.run({ querySelector: '.mermaid' });
    });
  </script>
</head>
